# AgriFlow production stack (EC2): nginx -> backend -> ml. Postgres is RDS.
#
# Prerequisites:
#   - deploy/.env written by deploy/load-env.sh (from SSM Parameter Store).
#   - CloudWatch log groups /agriflow/nginx, /agriflow/backend and /agriflow/ml
#     must already exist in ap-south-1 (awslogs-create-group is "false"), and the
#     instance role needs logs:CreateLogStream + logs:PutLogEvents on them.
#   - The instance role needs s3:GetObject on the models bucket/prefix.
#
# Memory: mem_limits total ~2.4 GiB of the 4 GB t3.medium, leaving room for the OS,
# dockerd and the CloudWatch log driver. Peaks were measured locally with docker stats
# + cgroup memory.peak.
#
# Usage (from repo root):
#   docker compose -f deploy/docker-compose.prod.yml up --build -d

name: agriflow

x-common: &common
  env_file: .env
  restart: unless-stopped

services:
  ml:
    <<: *common
    build: ../ml_service
    image: agriflow-ml
    expose:
      - "5001"
    volumes:
      - ml-models:/models   # S3 model cache; survives restarts so models aren't re-downloaded
    mem_limit: 2048m        # measured peak 522 MiB (load + 20-VU price predictions); headroom for the 1.9 GiB seen natively
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /agriflow/ml
        awslogs-create-group: "false"

  backend:
    <<: *common
    build: ../backend
    image: agriflow-backend
    expose:
      - "5000"
    environment:
      ML_SERVICE_URL: http://ml:5001
    depends_on:
      ml:
        condition: service_healthy
    mem_limit: 384m         # measured peak 54 MiB at 50 VUs; headroom for 50 MB JSON bodies
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /agriflow/backend
        awslogs-create-group: "false"

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-proxy.conf:/etc/nginx/agriflow_proxy.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 64m          # measured peak 20 MiB
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /agriflow/nginx
        awslogs-create-group: "false"

volumes:
  ml-models:
  certbot-www:
  letsencrypt:
