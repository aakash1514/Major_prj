# Mounted as /etc/nginx/conf.d/default.conf in the nginx container.
# API hostname: api.agriflow.me (Let's Encrypt cert via certbot webroot).

server_tokens off;

# Docker's embedded DNS. With proxy_pass on a variable, nginx re-resolves
# "backend" (valid=10s) so a recreated backend container is picked up
# without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP: only the ACME challenge (certificate renewal) and the container
# healthcheck stay on port 80; everything else redirects to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.agriflow.me;

    # Certbot webroot (HTTP-01 challenge) - needed for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container healthcheck only (docker-compose hits http://127.0.0.1/nginx-health).
    # stub_status (a content handler) is used instead of "return 200": return runs
    # before allow/deny and would bypass the restriction.
    location = /nginx-health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        stub_status;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.agriflow.me;

    ssl_certificate     /etc/letsencrypt/live/api.agriflow.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agriflow.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Matches the backend's express.json/urlencoded limit.
    client_max_body_size 50m;

    # API. proxy_pass with a variable and no URI part forwards the original
    # request URI (path + query string) unchanged.
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        include /etc/nginx/agriflow_proxy.conf;
        # ML predictions can take a while under load.
        proxy_read_timeout 120s;
    }

    # Legacy static uploads served by express.static (read-only).
    location /uploads/ {
        limit_except GET { deny all; }
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        include /etc/nginx/agriflow_proxy.conf;
    }

    # API info endpoint at the backend root.
    location = / {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        include /etc/nginx/agriflow_proxy.conf;
    }

    location / {
        return 404;
    }
}