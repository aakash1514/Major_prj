name: Deploy backend (EC2)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml_service/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

# Never run two deploys at the same time; queue the newer one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write   # lets the job request a GitHub OIDC token for AWS
  contents: read

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-044d1a03bfe6aea35

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy on the server via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1500 \
            --parameters 'commands=["cd /opt/agriflow && git fetch -q origin main && git reset -q --hard origin/main && bash deploy/remote-deploy.sh"],executionTimeout=["1500"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 150); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "----- server output (last part) -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 60
          echo "----- server errors (last part) -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -n 40

          test "$STATUS" = "Success"

      - name: Check the live API
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS https://api.agriflow.me/api/health; then echo; exit 0; fi
            sleep 5
          done
          echo "API health check failed"; exit 1