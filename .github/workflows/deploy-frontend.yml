name: Deploy frontend (S3 + CloudFront)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  BUCKET: agriflow-frontend-805496480789
  DISTRIBUTION_ID: E3N4BBCLLPCU70

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_RAZORPAY_KEY: ${{ vars.VITE_RAZORPAY_KEY }}
        run: |
          test -n "$VITE_API_URL" || { echo "Repository variable VITE_API_URL is not set"; exit 1; }
          test -n "$VITE_RAZORPAY_KEY" || { echo "Repository variable VITE_RAZORPAY_KEY is not set"; exit 1; }
          npm run build
          grep -q "api.agriflow.me" dist/assets/*.js || { echo "Built bundle does not contain the API URL"; exit 1; }

      - name: Get AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Hashed asset files never change, so browsers may cache them for a year.
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          # index.html must always be re-checked so users get the newest version.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"

      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text